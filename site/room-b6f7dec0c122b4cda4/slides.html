<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private document | Flow2</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eef4f0;color:#173b34;font:17px/1.5 system-ui,sans-serif;min-height:100svh;display:grid;place-items:center}main{background:white;padding:clamp(24px,5vw,48px);width:min(90vw,420px);border-radius:14px}h1{font-size:1.7rem;margin:6px 0 20px}label,input,button{display:block;width:100%}input,button{font:inherit;border-radius:6px;padding:10px}input{border:1px solid #527568;margin:5px 0 16px}button{border:0;background:#194d40;color:white;cursor:pointer}small{letter-spacing:.12em}p{margin-bottom:0}</style></head><body><main><small>FLOW2</small><h1>Private document</h1><form><label for="pw">Password</label><input id="pw" name="password" type="password" autocomplete="current-password" required><button>Open document</button><p role="status" id="msg"></p></form></main><script>
document.querySelector('form').addEventListener('submit',async e=>{e.preventDefault();const btn=e.target.querySelector('button'),msg=document.querySelector('#msg'),pw=document.querySelector('#pw');btn.disabled=true;msg.textContent='Opening…';try{const r=await fetch('./slides.bin',{cache:'no-store'});if(!r.ok)throw Error('load');const b=new Uint8Array(await r.arrayBuffer());const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b.slice(0,16),iterations:600000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(16,28)},key,b.slice(28));pw.value='';const html=new TextDecoder().decode(plain);document.open();document.write(html);document.close()}catch(err){msg.textContent=err.name==='OperationError'?'Incorrect password. Please try again.':'Could not open the file. Please try again.';btn.disabled=false;pw.select()}});
</script></body></html>
