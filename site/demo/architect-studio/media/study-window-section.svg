<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d" xml:lang="en"><title id="t">Window and seat — one-window living room section</title><desc id="d">An original qualitative section of a room with one glazed opening. A person sits on a low-backed sofa away from the window and curtain. The dashed line at eye level is above the sill; a pale ochre fan marks the idea of entering light rather than measured exposure. The open margin allows access for cleaning and drawing the curtain.</desc><style>
